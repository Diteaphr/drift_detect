# DriftTypeClassifier default config
# 3-way: sudden, gradual, incremental

# Data generation
n_streams: 300
streams_per_class: 100
stream_length: 2000
n_features: 10
n_classes: 2
drift_position_range: [0.4, 0.6]  # fraction of stream_length
gradual_window_size: 200
incremental_window_size: 400
random_seed: 42

# Alert simulation
alert_noise_radius: 20

# Feature extraction
pre_window: 150
post_window: 150
n_subwindows: 15
use_extra_features: false

# Train/val/test split (by stream_id)
# n_folds > 1: fixed test set; train+val split into K folds (different val set each fold)
n_folds: 5   # 0 or 1 = single train/val/test; 5 = 5-fold on train+val, same test
train_ratio: 0.7
val_ratio: 0.15
test_ratio: 0.15

# FAN encoder
d_model: 64
n_heads: 4
n_layers: 3
dim_feedforward: 128
dropout: 0.1
embed_dim: 64

# Training mode: "episodic" = ProtoNet N-way K-shot; "standard" = encoder + linear
train_mode: episodic
# Encoder: "fan" or "mlp" (use train_mode: standard + encoder_type: mlp for ~0.7 test F1)
encoder_type: fan
# Prototypical / episodic training (used when train_mode: episodic)
n_way: 3
k_shot: 5
q_query: 15
episodes_per_epoch: 100
max_epochs: 100
early_stopping_patience: 15
lr: 0.02    # ProtoNet needs higher lr; 0.001–0.005 left loss ~ln(3)
gradient_clip: 1.0
batch_episodes: 1

# Paths
data_dir: data
checkpoint_dir: checkpoints
log_dir: logs
