# Lighter FAN for small data (14-d gap, ~300 samples). Use with train_mode: standard to improve FAN F1.
# lr=0.03 works well; 0.001 is more conservative.

n_streams: 300
streams_per_class: 100
stream_length: 2000
n_features: 10
n_classes: 2
drift_position_range: [0.4, 0.6]
gradual_window_size: 200
incremental_window_size: 400
random_seed: 42
alert_noise_radius: 20
pre_window: 150
post_window: 150
n_subwindows: 15
use_extra_features: false
n_folds: 0
train_ratio: 0.7
val_ratio: 0.15
test_ratio: 0.15

# Lighter FAN
train_mode: standard
encoder_type: fan
d_model: 32
n_heads: 2
n_layers: 1
dim_feedforward: 64
dropout: 0.0
embed_dim: 32
norm_first: true

n_way: 3
k_shot: 5
q_query: 15
episodes_per_epoch: 100
max_epochs: 150
early_stopping_patience: 25
lr: 0.03
gradient_clip: 1.0
batch_episodes: 1
data_dir: data
checkpoint_dir: checkpoints
log_dir: logs
